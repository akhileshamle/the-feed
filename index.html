<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Feed</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e4e4de; --accent:#b4531a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --fg:#ecebe6; --muted:#9a998f; --card:#1d1d1b; --line:#2e2e2b; --accent:#e08a50; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 20px; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .filters button { font:inherit; font-size:.85rem; padding:6px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--fg); cursor:pointer; }
  .filters button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  article { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .meta { display:flex; justify-content:space-between; gap:12px; font-size:.8rem; color:var(--muted); margin-bottom:8px; }
  .tag { color:var(--accent); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .body h1,.body h2,.body h3 { font-size:1.05rem; margin:14px 0 6px; }
  .body p { margin:8px 0; }
  .body ul,.body ol { padding-left: 22px; margin: 8px 0; }
  .body code { background:var(--bg); padding:1px 5px; border-radius:4px; font-size:.9em; }
  .body pre { background:var(--bg); padding:12px; border-radius:8px; overflow-x:auto; }
  .body pre code { padding:0; background:none; }
  .empty, .err { color:var(--muted); text-align:center; padding:40px 0; }
</style>
</head>
<body>
<main>
  <h1>The Feed</h1>
  <div class="sub" id="updated">Loading…</div>
  <div class="filters" id="filters"></div>
  <div id="list"></div>
</main>
<script>
(function () {
  var listEl = document.getElementById('list');
  var filtersEl = document.getElementById('filters');
  var updatedEl = document.getElementById('updated');
  var entries = [];
  var active = 'all';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // Small, safe markdown: escape first, then format. Only http(s) links are allowed.
  function inline(t) {
    t = esc(t);
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" rel="noopener noreferrer">$1</a>');
    return t;
  }
  function md(src) {
    var lines = String(src).replace(/\r/g, '').split('\n');
    var out = [], list = null, code = false, buf = [], para = [];
    function flushPara() { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } }
    function closeList() { if (list) { out.push('</' + list + '>'); list = null; } }
    lines.forEach(function (line) {
      if (/^```/.test(line)) {
        if (code) { out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); buf = []; code = false; }
        else { flushPara(); closeList(); code = true; }
        return;
      }
      if (code) { buf.push(line); return; }
      var h = line.match(/^(#{1,3})\s+(.*)$/);
      var ul = line.match(/^\s*[-*]\s+(.*)$/);
      var ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (h) { flushPara(); closeList(); out.push('<h3>' + inline(h[2]) + '</h3>'); }
      else if (ul) { flushPara(); if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inline(ul[1]) + '</li>'); }
      else if (ol) { flushPara(); if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inline(ol[1]) + '</li>'); }
      else if (!line.trim()) { flushPara(); closeList(); }
      else { closeList(); para.push(line.trim()); }
    });
    if (code) out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
    flushPara(); closeList();
    return out.join('\n');
  }

  function fmt(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleString(undefined, { weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit' });
  }

  function render() {
    var shown = entries.filter(function (e) { return active === 'all' || e.slot === active; });
    if (!shown.length) { listEl.innerHTML = '<div class="empty">Nothing here yet.</div>'; return; }
    listEl.innerHTML = shown.map(function (e) {
      return '<article><div class="meta"><span class="tag">' + esc(e.slot) + '</span><span>' + esc(fmt(e.time)) +
             '</span></div><div class="body">' + md(e.text) + '</div></article>';
    }).join('');
  }

  function renderFilters() {
    var slots = ['all'];
    entries.forEach(function (e) { if (slots.indexOf(e.slot) < 0) slots.push(e.slot); });
    filtersEl.innerHTML = slots.map(function (s) {
      return '<button type="button" data-s="' + esc(s) + '" aria-pressed="' + (s === active) + '">' + esc(s) + '</button>';
    }).join('');
  }
  filtersEl.addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b) return;
    active = b.getAttribute('data-s');
    renderFilters(); render();
  });

  fetch('feed.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      entries = (data.entries || []).slice().sort(function (a, b) { return a.time < b.time ? 1 : -1; });
      updatedEl.textContent = entries.length ? 'Last run: ' + fmt(entries[0].time) : 'No runs yet';
      renderFilters(); render();
    })
    .catch(function () {
      updatedEl.textContent = '';
      listEl.innerHTML = '<div class="err">Could not load feed.json.</div>';
    });
})();
</script>
</body>
</html>
